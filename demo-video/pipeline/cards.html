<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laal demo — cards</title>
<style>
  /* Brand tokens mirror apps/web/app/globals.css */
  :root {
    --bg: #f3eee4; --surface: #fbf8f2; --ink: #2a2620; --muted: #6b6255;
    --accent: #8a5a3c; --accent-soft: #efe1d3; --line: #e6ddcd;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: var(--sans); color: var(--ink); }
  body.card { background: radial-gradient(1200px 800px at 30% 20%, #fbf8f2 0%, var(--bg) 60%, #ece5d6 100%); }
  body.lower { background: transparent; }

  /* ---- title card ---- */
  .card-wrap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .card-inner { max-width: 1240px; }
  .eyebrow { font-family: var(--sans); font-size: 26px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .headline { font-family: var(--serif); font-size: 128px; line-height: 1.05; margin: 22px 0 26px; font-weight: 600; letter-spacing: -0.01em; }
  .headline .laal { color: var(--accent); font-style: italic; }
  .sub { font-size: 34px; color: var(--muted); }
  .mark { position: absolute; left: 96px; top: 76px; display: flex; align-items: center; gap: 16px; font-family: var(--serif); font-size: 40px; font-weight: 700; }
  .mark i { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: #fffdf8; display: grid; place-items: center; font-style: normal; font-size: 26px; }
  .rule { width: 88px; height: 4px; background: var(--accent); margin: 0 auto 30px; border-radius: 2px; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .35;
    background: repeating-radial-gradient(circle at 0 0, transparent 0, transparent 3px, rgba(42,38,32,.012) 4px); }

  /* entrance animation, started by window.__play() */
  .a { opacity: 0; transform: translateY(26px); }
  .play .a { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  .play .a.d1 { animation-delay: .15s } .play .a.d2 { animation-delay: .5s } .play .a.d3 { animation-delay: .95s } .play .a.d4 { animation-delay: 1.3s }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .play .card-wrap { animation: breathe 9s ease-in-out forwards; }
  @keyframes breathe { from { transform: scale(1) } to { transform: scale(1.035) } }

  /* ---- lower third ---- */
  .lt { position: absolute; left: 72px; bottom: 64px; display: flex; align-items: stretch; gap: 0;
    background: rgba(251,248,242,.94); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(42,38,32,.16), 0 1px 2px rgba(42,38,32,.08); backdrop-filter: blur(6px); }
  .lt .bar { width: 10px; background: var(--accent); }
  .lt .txt { padding: 18px 30px 18px 26px; font-size: 27px; font-weight: 600; letter-spacing: -0.005em; display: flex; align-items: center; gap: 18px; }
  .lt .txt .sep { color: var(--accent); opacity: .7; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const laal = s => esc(s).replace(/\bLaal\b/g, '<span class="laal">Laal</span>');
  if (q.has('lower')) {
    document.body.className = 'lower';
    const parts = q.get('lower').split(/\s+·\s+/).map(esc);
    document.body.innerHTML = `<div class="lt"><div class="bar"></div><div class="txt">${parts.join('<span class="sep">·</span>')}</div></div>`;
  } else {
    document.body.className = 'card';
    document.body.innerHTML = `
      <div class="grain"></div>
      <div class="mark a d1"><i>L</i>Laal</div>
      <div class="card-wrap"><div class="card-inner">
        <div class="eyebrow a d1">${esc(q.get('eyebrow') || '')}</div>
        <div class="headline a d2">${laal(q.get('headline') || '')}</div>
        <div class="rule a d3"></div>
        <div class="sub a d4">${esc(q.get('sub') || '')}</div>
      </div></div>`;
    window.__play = () => document.body.classList.add('play');
    if (q.has('autoplay')) window.__play();
  }
</script>
</body>
</html>
